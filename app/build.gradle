plugins {
    id 'com.android.application'
}

android {
    namespace 'com.apksaver'
    compileSdk 35

    defaultConfig {
        applicationId 'com.apksaver'
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Signed with the debug key so the release APK installs without extra setup.
            // Replace with your own signingConfig for distribution.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

// No dependencies: the app uses only the Android framework.
